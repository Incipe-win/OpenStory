name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: openstory
          POSTGRES_PASSWORD: openstory
          POSTGRES_DB: openstory
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U openstory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest
      - name: Run migrations
        env:
          DATABASE_URL: postgres://openstory:openstory@localhost:15432/openstory?sslmode=disable
        run: goose -dir migrations postgres "$DATABASE_URL" up
      - name: Go test
        env:
          DATABASE_URL: postgres://openstory:openstory@localhost:15432/openstory?sslmode=disable
        run: go test ./... -race -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: ./...

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build --target api -t openstory-api:ci .
      - name: Build worker image
        run: docker build --target worker -t openstory-worker:ci .
      - name: Build outbox relay image
        run: docker build --target outbox-relay -t openstory-outbox-relay:ci .
      - name: Build consumer image
        run: docker build --target consumer -t openstory-consumer:ci .
