services:
  # ─── PostgreSQL ─────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: openstory-postgres
    environment:
      POSTGRES_USER: openstory
      POSTGRES_PASSWORD: openstory
      POSTGRES_DB: openstory
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openstory"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Redis ──────────────────────────────────────────
  redis:
    image: redis:8
    container_name: openstory-redis
    ports:
      - "16379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Kafka (KRaft mode, no ZooKeeper) ──────────────
  kafka:
    image: apache/kafka:4.2.0
    container_name: openstory-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "openstory-kafka-cluster-001"
    ports:
      - "19092:19092"

  # ─── MinIO (S3-compatible) ─────────────────────────
  minio:
    image: minio/minio:latest
    container_name: openstory-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── MinIO bucket init ─────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/openstory &&
        echo 'Bucket openstory created'
      "

  # ─── Database Migration ───────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: openstory-migrate
    command:
      - "postgres"
      - "postgres://openstory:openstory@postgres:5432/openstory?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ─── API Server ────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: openstory-api
    ports:
      - "18080:8080"
      - "19094:9090"
    environment:
      APP_ENV: development
      SERVER_PORT: "8080"
      DATABASE_URL: postgres://openstory:openstory@postgres:5432/openstory?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      MINIO_ENDPOINT: localhost:19000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: openstory
      MINIO_REGION: us-east-1
      MINIO_USE_SSL: "false"
      RATE_LIMIT_USER_PER_MINUTE: ${RATE_LIMIT_USER_PER_MINUTE:-120}
      RATE_LIMIT_IP_PER_MINUTE: ${RATE_LIMIT_IP_PER_MINUTE:-300}
      TASK_CONCURRENT_LIMIT: ${TASK_CONCURRENT_LIMIT:-5}
      OBSERVABILITY_ADDR: :9090
      OTEL_SERVICE_NAME: openstory
      OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-host.docker.internal:4318}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Worker ────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: openstory-worker
    ports:
      - "19095:9090"
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://openstory:openstory@postgres:5432/openstory?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: openstory
      MINIO_REGION: us-east-1
      MINIO_USE_SSL: "false"
      PROVIDER_MAX_ATTEMPTS: ${PROVIDER_MAX_ATTEMPTS:-2}
      PROVIDER_CONFIG_ENCRYPTION_KEY: ${PROVIDER_CONFIG_ENCRYPTION_KEY:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-https://api.openai.com/v1}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-gpt-4o-mini}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-}
      COMFYUI_API_KEY: ${COMFYUI_API_KEY:-}
      REPLICATE_BASE_URL: ${REPLICATE_BASE_URL:-https://api.replicate.com/v1}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      OBSERVABILITY_ADDR: :9090
      OTEL_SERVICE_NAME: openstory
      OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-host.docker.internal:4318}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Outbox Relay ─────────────────────────────────
  outbox-relay:
    build:
      context: .
      dockerfile: Dockerfile
      target: outbox-relay
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: openstory-outbox-relay
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://openstory:openstory@postgres:5432/openstory?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      OBSERVABILITY_ADDR: :9090
      OTEL_SERVICE_NAME: openstory
      OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-host.docker.internal:4318}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
    ports:
      - "19090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Kafka Consumers ──────────────────────────────
  analytics-consumer:
    build:
      context: .
      dockerfile: Dockerfile
      target: consumer
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: openstory-analytics-consumer
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://openstory:openstory@postgres:5432/openstory?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      CONSUMER_NAME: analytics-consumer
      CONSUMER_METRICS_ADDR: :9090
      OTEL_SERVICE_NAME: openstory
      OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-host.docker.internal:4318}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
    ports:
      - "19091:9090"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  notification-consumer:
    build:
      context: .
      dockerfile: Dockerfile
      target: consumer
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: openstory-notification-consumer
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://openstory:openstory@postgres:5432/openstory?sslmode=disable
