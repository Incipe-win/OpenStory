      CONSUMER_NAME: moderation-consumer
      CONSUMER_METRICS_ADDR: :9090
      OTEL_SERVICE_NAME: openstory
      OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-host.docker.internal:4318}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
    ports:
      - "19098:9090"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  audit-consumer:
    build:
      context: .
      dockerfile: Dockerfile
      target: consumer
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: openstory-audit-consumer
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://openstory:openstory@postgres:5432/openstory?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      CONSUMER_NAME: audit-consumer
