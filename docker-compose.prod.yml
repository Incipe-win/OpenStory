# ============================================================
# OpenStory Production Docker Compose
# ============================================================
#
# Quick start:
#   1. cp .env.production .env
#   2. Edit .env and set MINIO_PUBLIC_ENDPOINT to http://<server-ip>:9000
#   3. docker compose -f docker-compose.prod.yml up -d --build
#   4. Access at http://<server-ip>
#
# ============================================================

services:
  # ─── Nginx Reverse Proxy ─────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
      network: host
    container_name: openstory-nginx
    ports:
      - "80:80"
      - "443:443"
      - "2053:2053"
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - openstory-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  # ─── Frontend (Next.js) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: openstory-frontend
    environment:
      NODE_ENV: production
      API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    networks:
      - openstory-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ─── Database Migration ──────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: openstory-migrate
    command:
      - "postgres"
      - "postgres://openstory:096ef151b8a7a96293ce002ee3025de5@postgres:5432/openstory?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openstory-net
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

  # ─── API Server ──────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: openstory-api
    env_file:
      - .env
    environment:
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - openstory-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ─── Worker (Asynq) ──────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: openstory-worker
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - openstory-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ─── Outbox Relay ────────────────────────────────────
  outbox-relay:
    build:
      context: .
      dockerfile: Dockerfile
      target: outbox-relay
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: openstory-outbox-relay
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - openstory-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  # ─── Kafka Consumers ─────────────────────────────────
  analytics-consumer:
    build:
      context: .
      dockerfile: Dockerfile
      target: consumer
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: openstory-analytics-consumer
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://openstory:096ef151b8a7a96293ce002ee3025de5@postgres:5432/openstory?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      CONSUMER_NAME: analytics-consumer
      CONSUMER_METRICS_ADDR: :9090
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - openstory-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  notification-consumer:
    build:
      context: .
      dockerfile: Dockerfile
      target: consumer
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: openstory-notification-consumer
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://openstory:096ef151b8a7a96293ce002ee3025de5@postgres:5432/openstory?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      CONSUMER_NAME: notification-consumer
      CONSUMER_METRICS_ADDR: :9090
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - openstory-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  feed-consumer:
    build:
      context: .
      dockerfile: Dockerfile
      target: consumer
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: openstory-feed-consumer
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://openstory:096ef151b8a7a96293ce002ee3025de5@postgres:5432/openstory?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      CONSUMER_NAME: feed-consumer
      CONSUMER_METRICS_ADDR: :9090
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - openstory-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  moderation-consumer:
    build:
      context: .
      dockerfile: Dockerfile
      target: consumer
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: openstory-moderation-consumer
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://openstory:096ef151b8a7a96293ce002ee3025de5@postgres:5432/openstory?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      CONSUMER_NAME: moderation-consumer
      CONSUMER_METRICS_ADDR: :9090
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - openstory-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  audit-consumer:
    build:
      context: .
      dockerfile: Dockerfile
      target: consumer
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: openstory-audit-consumer
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://openstory:096ef151b8a7a96293ce002ee3025de5@postgres:5432/openstory?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      CONSUMER_NAME: audit-consumer
      CONSUMER_METRICS_ADDR: :9090
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - openstory-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  # ─── PostgreSQL ──────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: openstory-postgres
    environment:
      POSTGRES_USER: openstory
      POSTGRES_PASSWORD: 096ef151b8a7a96293ce002ee3025de5
      POSTGRES_DB: openstory
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - openstory-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openstory"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ─── Redis ──────────────────────────────────────────
  redis:
    image: redis:8
    container_name: openstory-redis
    command: redis-server --requirepass 8a7dc25d81ade9c1693e23dd5ee9d600 --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - openstory-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "8a7dc25d81ade9c1693e23dd5ee9d600", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # ─── Kafka (KRaft mode) ─────────────────────────────
  kafka:
    image: apache/kafka:4.2.0
    container_name: openstory-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "openstory-kafka-prod-001"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafkadata:/var/lib/kafka/data
    networks:
      - openstory-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

  # ─── MinIO (S3-compatible) ──────────────────────────
  minio:
    image: minio/minio:latest
    container_name: openstory-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: 81dab039671c13b45b0a9997ebdda4a6
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - openstory-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ─── MinIO Bucket Init ──────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: openstory-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin 81dab039671c13b45b0a9997ebdda4a6 &&
        mc mb --ignore-existing local/openstory &&
        echo 'Bucket openstory created'
      "
    networks:
      - openstory-net
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

networks:
  openstory-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
  kafkadata:
